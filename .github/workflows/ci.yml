name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]   # Windows = what shops run; Linux = fast second opinion
        node: [22, 26]                        # 22 = oldest supported by better-sqlite3; 26 = current dev version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # Install scripts are skipped: better-sqlite3, esbuild and oxlint ship ready-made binaries,
      # and nothing needs compiling. (The root package, i.e. Electron, is not needed for these checks.)
      - name: Install server dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: server

      - name: Install client dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: client

      - name: Lint server
        run: npm run lint
        working-directory: server

      - name: Lint client
        run: npm run lint
        working-directory: client

      - name: Test server
        run: npm test
        working-directory: server

      - name: Test client
        run: npm test
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client
